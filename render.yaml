# One-click deploy on Render (render.com -> New -> Blueprint -> pick this repository).
# Builds the Dockerfile: React app + Flask API in one service. Add GNANI_API_KEY in the dashboard when asked.
services:
  - type: web
    name: pantha-sahayam
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GNANI_API_KEY
        sync: false            # secret: you paste it in the Render dashboard, never in this file
      - key: GNANI_TTS_MODEL
        value: timbre-v3.0
      - key: GNANI_MOCK
        value: "0"
      - key: BLOCK_UNVERIFIED
        value: "0"
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: TRUST_PROXY
        value: "1"
